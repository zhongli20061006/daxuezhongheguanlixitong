version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: sms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: student_management
    ports:
      # 仅本机可访问数据库，避免暴露到局域网/公网
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # SECRET_KEY 必须由宿主机注入（未设置则 compose 直接报错，fail-closed）
      # 生成方式：python -c "import secrets; print(secrets.token_urlsafe(48))"
      - SECRET_KEY=${SECRET_KEY:?请先设置宿主机环境变量 SECRET_KEY（生成方式见 README）}
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机 Ollama
      - "host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 首次启动后，运行以下命令初始化测试数据：
    #   docker compose exec backend python -m app.init_data

  frontend:
    build:
      context: ./student-management-frontend
      dockerfile: Dockerfile
    container_name: sms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
